pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.xposed.info/'
            content { includeGroup 'de.robv.android.xposed' }   // sirf Xposed API yahan se
        }
    }
}
rootProject.name = 'IOSConnectCluster'
include ':app'
